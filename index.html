<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گالری تصاویر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.2em;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 50px 20px;
            margin: 30px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #764ba2;
            background: #f0f2ff;
            transform: scale(1.02);
        }
        .upload-icon {
            font-size: 4em;
            color: #667eea;
            margin-bottom: 20px;
        }
        .upload-text {
            font-size: 1.3em;
            color: #555;
            margin-bottom: 10px;
        }
        .upload-subtext {
            color: #888;
            font-size: 1em;
        }
        #fileInput {
            display: none;
        }
        .gallery {
            display: none;
            margin-top: 30px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .gallery-item {
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .gallery-item:hover {
            transform: translateY(-5px);
        }
        .gallery-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
        .send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            width: 100%;
        }
        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .progress {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 15px;
            display: none;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 گالری تصاویر</h1>
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">تصاویر خود را انتخاب کنید</div>
            <div class="upload-subtext">فایل‌های JPG, PNG و GIF پشتیبانی می‌شوند (حداکثر 10 مگابایت)</div>
            <input type="file" id="fileInput" multiple accept="image/*">
        </div>
        
        <div class="gallery" id="gallery">
            <div class="gallery-grid" id="galleryGrid"></div>
            <button class="send-btn" id="sendBtn">ارسال به تلگرام 🚀</button>
        </div>

        <div class="status" id="status"></div>
        <div class="progress" id="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const gallery = document.getElementById('gallery');
        const galleryGrid = document.getElementById('galleryGrid');
        const sendBtn = document.getElementById('sendBtn');
        const status = document.getElementById('status');
        const progress = document.getElementById('progress');
        const progressBar = document.getElementById('progressBar');

        let selectedFiles = [];

        // انتخاب فایل
        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFiles);

        // Drag & Drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files).filter(file => file.type.startsWith('image/'));
            handleFiles({ target: { files } });
        });

        function handleFiles(event) {
            const files = Array.from(event.target.files).filter(file => {
                return file.type.startsWith('image/') && file.size <= 10 * 1024 * 1024;
            });

            selectedFiles = [...selectedFiles, ...files];
            displayGallery();
        }

        function displayGallery() {
            galleryGrid.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                div.innerHTML = `
                    <img src="${URL.createObjectURL(file)}" alt="${file.name}">
                    <div style="padding: 10px; background: rgba(0,0,0,0.7); color: white; font-size: 0.8em;">
                        ${file.name}<br>${(file.size / 1024 / 1024).toFixed(1)} MB
                    </div>
                `;
                galleryGrid.appendChild(div);
            });

            gallery.style.display = selectedFiles.length ? 'block' : 'none';
            sendBtn.disabled = selectedFiles.length === 0;
        }

        // ارسال به تلگرام
        sendBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;

            showStatus('در حال آپلود...', 'info');
            progress.style.display = 'block';
            sendBtn.disabled = true;

            try {
                const formData = new FormData();
                
                // ارسال همه فایل‌ها
                selectedFiles.forEach((file, index) => {
                    formData.append(`photo${index}`, file);
                });

                // TODO: توکن بات و chat_id رو جایگزین کن
                const TELEGRAM_BOT_TOKEN = '8494064157:AAGav4tOUJd2S2-ORWCTYJ_kvALnU0NCE-A'; // از @BotFather بگیر
                const CHAT_ID = '8198454441'; // آیدی چت تلگرام

                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMediaGroup`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.ok) {
                    showStatus(`✅ ${selectedFiles.length} تصویر با موفقیت ارسال شد!`, 'success');
                    selectedFiles = [];
                    displayGallery();
                } else {
                    throw new Error(result.description || 'خطا در ارسال');
                }
            } catch (error) {
                showStatus(`❌ خطا: ${error.message}`, 'error');
            } finally {
                progress.style.display = 'none';
                sendBtn.disabled = selectedFiles.length === 0;
                setTimeout(() => status.style.display = 'none', 5000);
            }
        });

        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }
    </script>
</body>
</html>
